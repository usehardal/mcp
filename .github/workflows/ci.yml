name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: bun type-check + test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # Fails on a lockfile that does not match package.json.
      - run: bun install --frozen-lockfile

      # A type error fails the run here.
      - run: bun run type-check

      - run: bun test

      # The server must actually boot and enforce auth. No token is needed: an
      # unauthenticated /mcp call is challenged before any introspection runs,
      # so this needs no service key or Beacon connection.
      - name: Smoke-test the HTTP server
        env:
          PORT: '1922'
        run: |
          bun run src/index.ts &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf "http://localhost:${PORT}/health" >/dev/null && break
            sleep 0.25
          done
          health=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/health")
          [ "$health" = "200" ] || { echo "health returned $health"; exit 1; }
          curl -sf "http://localhost:${PORT}/.well-known/oauth-protected-resource" \
            | grep -q '"resource"' || { echo "missing protected-resource metadata"; exit 1; }
          mcp=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:${PORT}/mcp" \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          [ "$mcp" = "401" ] || { echo "unauthenticated /mcp returned $mcp, expected 401"; exit 1; }
          echo "http smoke passed: /health 200, protected-resource metadata, /mcp 401"
