name: Trigger auto deployment for hardal-mcp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/hardal-mcp-AutoDeployTrigger-424f7956-3e09-4891-8b26-58147b80b506.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.HARDALMCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.HARDALMCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.HARDALMCP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: hardalmcp.azurecr.io
          registryUsername: ${{ secrets.HARDALMCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HARDALMCP_REGISTRY_PASSWORD }}
          containerAppName: hardal-mcp
          resourceGroup: hardal-rg
          imageToBuild: hardalmcp.azurecr.io/hardal-mcp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


